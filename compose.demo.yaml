# TCC II prototype, local demonstration (the same file runs on a server):
#   postgres  - conversation checkpoints (LangGraph); internal network only, no host port
#   backend   - frozen A''-J v2 (Jev + transition policy v2); no host port
#   interface - Streamlit (Bisco); the only port published, on 127.0.0.1
# Start/stop: scripts/start-local.cmd and scripts/stop-local.cmd (stop keeps the volumes).
# External PostgreSQL (managed service) instead of the container: deploy/compose.external-postgres.yaml.
name: tcc2-demo

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcc2}
      POSTGRES_USER: ${POSTGRES_USER:-tcc2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
      args:
        PROTOTYPE_GIT_TAG: ${PROTOTYPE_GIT_TAG:-tcc2-cond-v2}
        PROTOTYPE_GIT_COMMIT: ${PROTOTYPE_GIT_COMMIT:-unknown}
    image: tcc2-prototype-backend:${PROTOTYPE_IMAGE_TAG:-v2-local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    # Fixed here, after env_file, so a local .env cannot switch the evaluated configuration.
    # The checkpoint store is not part of it: only POSTGRES_* (connection) may come from .env.
    environment:
      CONVERSATION_INTERPRETER: jev
      CONVERSATION_INTERPRETER_CONFIG: '{"transition_policy": "v2"}'
      RETRIEVAL_TOP_K: "5"
      ROUTING_MODE: intent_v1
      DATABASE_TYPE: postgres
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-tcc2}
      POSTGRES_USER: ${POSTGRES_USER:-tcc2}
      CHROMA_PERSIST_DIR: /app/index
      HOST: 0.0.0.0
      PORT: "8080"
      MODE: prod
    volumes:
      - ${INDEX_DIR:-./.local/index}:/app/index
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - egress
    expose:
      - "8080"

  interface:
    build:
      context: .
      dockerfile: deploy/interface/Dockerfile
    image: tcc2-prototype-interface:${PROTOTYPE_IMAGE_TAG:-v2-local}
    restart: unless-stopped
    environment:
      AGENT_URL: http://backend:8080
      # Empty (default) = no bearer; when set, the backend requires it and the interface sends it.
      AUTH_SECRET: ${AUTH_SECRET:-}
    ports:
      - "127.0.0.1:${INTERFACE_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - egress

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  egress: {}
