# LEGADO: serviço anterior ao protótipo do TCC II (agente chatbot_ufpi_v2, PostgreSQL; desenvolvimento). Para o protótipo atual (A''-J v2 com a
# interface Bisco), use compose.demo.yaml e scripts/start-local.cmd, na raiz do repositório.
services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-agent_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent_service:
    build:
      context: ..
      dockerfile: code/docker/Dockerfile.service
    environment:
      CHROMA_PERSIST_DIR: /app/index
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 5
    # Volume mount of development-only credentials since compose watch doesn't sync ignored files and doesn't do initial sync when the service starts
    volumes:
      - ./privatecredentials:/privatecredentials
      - ./.local/chroma:/app/index
    develop:
      watch:
        - path: src/agents/
          action: sync+restart
          target: /app/code/src/agents/
        - path: src/schema/
          action: sync+restart
          target: /app/code/src/schema/
        - path: src/service/
          action: sync+restart
          target: /app/code/src/service/
        - path: src/core/
          action: sync+restart
          target: /app/code/src/core/
        - path: src/memory/
          action: sync+restart
          target: /app/code/src/memory/
        - path: src/rag_baseline/
          action: sync+restart
          target: /app/code/src/rag_baseline/
  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "8501:8501"
    depends_on:
      - agent_service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - AGENT_URL=http://agent_service:8080
    develop:
      watch:
        - path: src/client/
          action: sync+restart
          target: /app/code/src/client/
        - path: src/schema/
          action: sync+restart
          target: /app/code/src/schema/
        - path: src/streamlit_app.py
          action: sync+restart
          target: /app/code/src/streamlit_app.py

volumes:
  postgres_data:
