# LEGADO: serviço anterior ao protótipo do TCC II (launcher operacional que reutiliza um container de API antigo). Para o protótipo atual (A''-J v2 com a
# interface Bisco), use compose.demo.yaml e scripts/start-local.cmd, na raiz do repositório.
# Operational UI revision ui-rev-4 (Bisco). Only the interface runs from here; the API container and
# its image stay as frozen in the experimental baseline. Bound to loopback: not a public deploy.
services:
  ui:
    image: ufpi-tcc-local-streamlit_app:ui-rev-4
    container_name: ufpi-tcc-ui-rev-4
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      - AGENT_URL=http://agent_service:8080
      - STREAMLIT_CLIENT_TOOLBAR_MODE=minimal
      - STREAMLIT_SERVER_ENABLE_STATIC_SERVING=true
    ports:
      - "127.0.0.1:8501:8501"
    networks:
      - runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  runtime:
    name: ufpi-tcc-local_default
    external: true
